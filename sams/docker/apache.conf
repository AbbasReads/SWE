<VirtualHost *:80>
    WSGIDaemonProcess sams processes=2 threads=5 python-path=/srv/sams
    WSGIScriptAlias / /srv/sams/sams.wsgi

    <Directory /srv/sams>
        WSGIProcessGroup sams
        WSGIApplicationGroup %{GLOBAL}
        Require all granted
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
