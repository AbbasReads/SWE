# Two containers: MySQL (MariaDB) + app (Apache/mod_wsgi). No restart policy: nothing starts on boot.
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: sams
      MARIADB_USER: sams
      MARIADB_PASSWORD: sams
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  app:
    build: .
    ports:
      - "8080:80"
    environment:
      SAMS_DB_HOST: db
      SAMS_DB_USER: sams
      SAMS_DB_PASSWORD: sams
      SAMS_DB_NAME: sams
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
